<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>BUZ 2 Puantaj</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#0c0d14;color:#d4d4d8;font-size:13px}
.bar{background:#111219;border-bottom:1px solid #1e1f2e;padding:10px;position:sticky;top:0;z-index:100;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.bar-l{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar-r{display:flex;gap:4px;flex-wrap:wrap}
select.s{background:#1a1b2e;border:1px solid #2a2b3d;border-radius:6px;color:#d4d4d8;padding:4px 8px;font-size:12px}
.b{padding:5px 10px;border-radius:6px;border:1px solid #2a2b3d;background:none;color:#a1a1aa;cursor:pointer;font-weight:600;font-size:11px;font-family:inherit}
.b:active{transform:scale(.97)}
.ba{background:#818cf8!important;color:#0c0d14!important;border-color:#818cf8!important}
.days{padding:6px;background:#0f1019;border-bottom:1px solid #1e1f2e;display:flex;gap:2px;overflow-x:auto}
.d{min-width:30px;height:30px;border-radius:4px;border:0;cursor:pointer;font-size:10px;font-weight:700;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bulk{padding:6px 10px;background:#13141f;border-bottom:1px solid #1e1f2e;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tg{padding:3px 7px;border-radius:4px;border:1px solid;background:none;cursor:pointer;font-weight:600;font-size:10px;font-family:inherit}
.wrap{padding:4px;overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{padding:6px 3px;text-align:center;font-size:10px;font-weight:700;color:#818cf8;background:#111219;border-bottom:2px solid #1e1f2e}
td{padding:4px 3px;text-align:center;font-size:11px;border-bottom:1px solid #111219}
.nm{position:sticky;left:0;z-index:10;font-weight:600;font-size:10px;text-align:left;padding:4px 6px;white-space:nowrap;border-right:2px solid #1e1f2e}
.ms{background:#16171f;border:1px solid #1e1f2e;border-radius:4px;color:#d4d4d8;padding:3px;font-size:11px;width:100%;font-family:inherit}
.mi{background:#16171f;border:1px solid #1e1f2e;border-radius:4px;color:#d4d4d8;padding:3px 4px;font-size:11px;width:100%;font-family:inherit;outline:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CAL=["","08:00-16:00","08:00-18:00","08:00-20:00","16:00-24:00","24:00-08:00","20:00-08:00","Pazar Mesai-7,5","Pazar Mesai-11"];
const DUR=["","Off","DVS","Rapor","Ücretsiz İzin","Mazeret İzni","İstifa","Yıllık İzin","Cenazi İzni","Bayram İzni","Diğer"];
const MES={"08:00-16:00":0,"08:00-18:00":1.5,"08:00-20:00":3.5,"16:00-24:00":0,"24:00-08:00":0,"20:00-08:00":3.5,"Pazar Mesai-7,5":7.5,"Pazar Mesai-11":11};
const DC={"Off":"#71717a","DVS":"#ef4444","Rapor":"#fb923c","Ücretsiz İzin":"#a78bfa","Mazeret İzni":"#f472b6","İstifa":"#f59e0b","Yıllık İzin":"#60a5fa","Cenazi İzni":"#a78bfa","Bayram İzni":"#fbbf24","Diğer":"#a1a1aa"};
const DS={"Off":"OFF","DVS":"DVS","Rapor":"R","Ücretsiz İzin":"Üİ","Mazeret İzni":"Mİ","İstifa":"İST","Yıllık İzin":"Yİ","Cenazi İzni":"Cİ","Bayram İzni":"Bİ","Diğer":"D"};
const AY=["","Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const GN=["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
const DEF=["AYNUR SAVRAN","AYŞE ELİK","EMİNE CAYMAZ","ESMA BÜBER","FADİME ÇETİNKAYA","FADİME TURBAŞ","FATMA ATMACA","FATMA KORKMAZ","FİLİZ ÇİFTÇİ","GÜLİZAR DENİZ","HANİFE KAYA","HÜLYA YILDIZ","NAZMİYE URTAN","NEVİN İNAÇ","NURAY DOĞAN","SÜREYYA ŞAHİN","ULVİYE EFE","YAŞAR ARABACI","HAZAL KANBER"];

function mes(c,d){if(!c||c==="")return(d&&d!=="")?"-":"";if(d&&d!=="")return"-";return MES[c]!==undefined?MES[c]:""}
function dim(y,m){return new Date(y,m,0).getDate()}
function gn(y,m,d){return GN[new Date(y,m-1,d).getDay()]}
function ls(k,v){if(v===undefined){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}localStorage.setItem(k,JSON.stringify(v))}
if(!ls('emps'))ls('emps',DEF);
function emps(){return ls('emps')||DEF}
function dk(y,m){return'd_'+y+'_'+m}
function gd(y,m){return ls(dk(y,m))||{}}
function gc(data,i,d){return data[i+'_'+d]||{c:'',d:'',m:'',a:''}}
function sc(y,m,data,i,d,cal,dur,ack){
  data[i+'_'+d]={c:cal||'',d:dur||'',m:mes(cal,dur),a:ack||''};
  ls(dk(y,m),data);
}

let yr=2026,mo=5,focus=null,view='table';

function R(){
  const el=emps(),data=gd(yr,mo),days=dim(yr,mo),app=document.getElementById('app');
  app.innerHTML='';

  // BAR
  let bh=`<div class="bar"><div class="bar-l"><span style="font-size:16px">📋</span><span style="font-weight:800;color:#818cf8;font-size:14px">PUANTAJ</span>`;
  bh+=`<select class="s" onchange="mo=+this.value;focus=null;R()">`;
  AY.slice(1).forEach((a,i)=>bh+=`<option value="${i+1}"${i+1===mo?' selected':''}>${a}</option>`);
  bh+=`</select><select class="s" onchange="yr=+this.value;focus=null;R()">`;
  [2024,2025,2026,2027].forEach(y=>bh+=`<option value="${y}"${y===yr?' selected':''}>${y}</option>`);
  bh+=`</select></div><div class="bar-r">`;
  ['table','ozet','ayar'].forEach(v=>{
    bh+=`<button class="b ${view===v?'ba':''}" style="border-color:#818cf8;${view!==v?'color:#818cf8':''}" onclick="view='${v}';R()">${v==='table'?'📅 Puantaj':v==='ozet'?'📊 Özet':'⚙️ Personel'}</button>`;
  });
  bh+=`<button class="b" style="border-color:#34d399;color:#34d399" onclick="doExp()">📥 Export</button>`;
  bh+=`</div></div>`;
  app.insertAdjacentHTML('beforeend',bh);

  if(view==='table'){
    // DAYS
    let dh='<div class="days">';
    for(let d=1;d<=days;d++){
      const g=gn(yr,mo,d),p=g==='Paz',c=g==='Cmt';
      dh+=`<button class="d" style="background:${focus===d?'#818cf8':p?'#2d1215':c?'#1f1a0e':'#16171f'};color:${focus===d?'#0c0d14':p?'#f87171':c?'#fbbf24':'#71717a'}" onclick="focus=focus===${d}?null:${d};R()"><span>${d}</span><span style="font-size:7px;opacity:.7">${g}</span></button>`;
    }
    app.insertAdjacentHTML('beforeend',dh+'</div>');

    // BULK
    if(focus){
      let bk=`<div class="bulk"><span style="color:#818cf8;font-weight:700;font-size:11px">${focus} ${AY[mo]} →</span>`;
      [['OFF','#ef4444','','Off'],['Bayram','#fbbf24','','Bayram İzni'],['08-16','#3b82f6','08:00-16:00',''],['08-18','#3b82f6','08:00-18:00',''],['08-20','#3b82f6','08:00-20:00',''],['16-24','#8b5cf6','16:00-24:00',''],['20-08','#8b5cf6','20:00-08:00',''],['24-08','#8b5cf6','24:00-08:00','']].forEach(([l,co,cal,dur])=>{
        bk+=`<button class="tg" style="border-color:${co};color:${co}" onclick="bulkDay(${focus},'${cal}','${dur}')">${l}</button>`;
      });
      const dt=dayTot(el,data,focus);
      bk+=`<span style="color:#52525b;font-size:10px;margin-left:6px">Mesai: <b style="color:#34d399">${dt}</b></span></div>`;
      app.insertAdjacentHTML('beforeend',bk);
    }

    // TABLE
    const sd=focus?[focus]:Array.from({length:days},(_,i)=>i+1);
    const wrap=document.createElement('div');wrap.className='wrap';
    const tbl=document.createElement('table');
    
    // Head
    let hh='<thead><tr><th style="position:sticky;left:0;z-index:20;background:#111219;min-width:100px;text-align:left;padding-left:6px">ADI SOYADI</th>';
    sd.forEach(d=>{
      const g=gn(yr,mo,d),p=g==='Paz';
      hh+=`<th colspan="${focus?4:1}" style="background:${p?'#1f1015':'#111219'};color:${p?'#f87171':'#818cf8'};min-width:${focus?'340px':'36px'};border-left:1px solid #2a2b3d">${d} ${g}`;
      if(focus)hh+='<div style="font-size:8px;display:flex;gap:16px;justify-content:center;margin-top:2px;color:#52525b"><span>Çalışma</span><span>Durum</span><span>Mesai</span><span>Açıklama</span></div>';
      hh+='</th>';
    });
    hh+='<th style="color:#34d399">∑</th></tr></thead>';
    tbl.innerHTML=hh;

    const tb=document.createElement('tbody');

    // Day totals
    const tr0=document.createElement('tr');tr0.style.background='#0f1019';
    let t0h=`<td class="nm" style="background:#0f1019;font-weight:700;color:#818cf8;font-size:9px">Günlük Mesai</td>`;
    sd.forEach(d=>{const dt=dayTot(el,data,d);t0h+=`<td colspan="${focus?4:1}" style="font-weight:700;color:${dt>0?'#34d399':'#3f3f46'};border-left:1px solid #1e1f2e">${dt||'-'}</td>`});
    t0h+='<td></td>';tr0.innerHTML=t0h;tb.appendChild(tr0);

    // Rows
    el.forEach((name,ei)=>{
      const tr=document.createElement('tr');
      const bg=ei%2===0?'#0c0d14':'#111219';
      tr.style.background=bg;

      const ntd=document.createElement('td');ntd.className='nm';ntd.style.background=bg;ntd.textContent=name;
      tr.appendChild(ntd);

      sd.forEach(d=>{
        const cell=gc(data,ei,d);
        if(focus){
          const td=document.createElement('td');td.style.cssText='border-left:1px solid #1e1f2e;padding:2px';
          const rw=document.createElement('div');rw.style.cssText='display:flex;gap:3px;align-items:center';

          const s1=document.createElement('select');s1.className='ms';s1.style.flex='2';
          CAL.forEach(o=>{const op=new Option(o||'—',o);if(o===cell.c)op.selected=true;s1.add(op)});
          ((ei_,d_)=>{s1.onchange=function(){const data_=gd(yr,mo);sc(yr,mo,data_,ei_,d_,this.value,gc(data_,ei_,d_).d,gc(data_,ei_,d_).a);R()}})(ei,d);

          const s2=document.createElement('select');s2.className='ms';s2.style.flex='2';
          s2.style.color=DC[cell.d]||'#d4d4d8';
          DUR.forEach(o=>{const op=new Option(o||'—',o);if(o===cell.d)op.selected=true;s2.add(op)});
          ((ei_,d_)=>{s2.onchange=function(){const data_=gd(yr,mo);sc(yr,mo,data_,ei_,d_,gc(data_,ei_,d_).c,this.value,gc(data_,ei_,d_).a);R()}})(ei,d);

          const sp=document.createElement('span');
          sp.style.cssText='min-width:30px;text-align:center;font-size:12px;font-weight:700;color:'+(cell.m>0?'#34d399':cell.m===0?'#52525b':'#3f3f46');
          sp.textContent=cell.m!==""?cell.m:'';

          const inp=document.createElement('input');inp.className='mi';inp.style.flex='2';inp.placeholder='...';inp.value=cell.a||'';
          ((ei_,d_)=>{inp.onchange=function(){const data_=gd(yr,mo);sc(yr,mo,data_,ei_,d_,gc(data_,ei_,d_).c,gc(data_,ei_,d_).d,this.value)}})(ei,d);

          rw.append(s1,s2,sp,inp);td.appendChild(rw);tr.appendChild(td);
        } else {
          const td=document.createElement('td');
          td.style.cssText='cursor:pointer;min-width:36px;padding:2px 1px;border-left:'+(gn(yr,mo,d)==='Paz'?'2px solid #2d1215':'1px solid #1a1b2e');
          let disp='·',tc='#3f3f46',tbg='transparent';
          if(cell.d){disp=DS[cell.d]||cell.d;tc=DC[cell.d]||'#a1a1aa';tbg=cell.d==='Off'?'#1a1215':cell.d==='Bayram İzni'?'#1f1a0e':'transparent'}
          else if(cell.c){if(cell.m>0){disp=cell.m;tc='#34d399';tbg='#0f1a15'}else if(cell.m===0||cell.m==='0'){disp=cell.c.replace(/:00/g,'');tc='#52525b'}else disp='·'}
          td.style.background=tbg;
          td.innerHTML='<div style="font-size:9px;font-weight:700;color:'+tc+';line-height:1.2">'+disp+'</div>';
          ((dd)=>{td.onclick=()=>{focus=dd;R()}})(d);
          tr.appendChild(td);
        }
      });

      const tot=empTot(el,data,ei,days);
      const ttd=document.createElement('td');ttd.style.cssText='font-weight:700;color:'+(tot>0?'#34d399':'#3f3f46')+';font-size:11px';
      ttd.textContent=tot||'-';tr.appendChild(ttd);
      tb.appendChild(tr);
    });
    tbl.appendChild(tb);wrap.appendChild(tbl);app.appendChild(wrap);
  }

  if(view==='ozet'){
    let h='<div style="padding:12px;overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead><tr>';
    ['Personel','Mesai','Off','DVS','R','Üİ','Mİ','Yİ','Bİ','İST','Gün'].forEach(t=>h+=`<th style="padding:8px 4px;background:#111219;color:#818cf8;border-bottom:2px solid #1e1f2e;font-size:10px">${t}</th>`);
    h+='</tr></thead><tbody>';
    el.forEach((name,i)=>{
      const tot=empTot(el,data,i,days),st=eSt(data,i,days);
      let wd=0;for(let d=1;d<=days;d++){const c=gc(data,i,d);if(c.c&&!c.d)wd++}
      h+=`<tr style="background:${i%2===0?'#111219':'#14151f'}"><td style="padding:6px;text-align:left;font-weight:700;font-size:11px;border-bottom:1px solid #1e1f2e">${name}</td>`;
      h+=`<td style="padding:6px;text-align:center;color:${tot>0?'#34d399':'#52525b'};font-weight:700;border-bottom:1px solid #1e1f2e">${tot}</td>`;
      ['Off','DVS','Rapor','Ücretsiz İzin','Mazeret İzni','Yıllık İzin','Bayram İzni','İstifa'].forEach(k=>{
        h+=`<td style="padding:6px;text-align:center;color:${st[k]?DC[k]:'#52525b'};border-bottom:1px solid #1e1f2e;font-size:11px">${st[k]||'-'}</td>`;
      });
      h+=`<td style="padding:6px;text-align:center;border-bottom:1px solid #1e1f2e">${wd}</td></tr>`;
    });
    app.insertAdjacentHTML('beforeend',h+'</tbody></table></div>');
  }

  if(view==='ayar'){
    let h='<div style="padding:12px;max-width:500px"><p style="color:#818cf8;font-weight:700;margin-bottom:12px">👥 Personel ('+el.length+')</p>';
    el.forEach((n,i)=>h+=`<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:${i%2===0?'#111219':'#14151f'};border-radius:6px;margin-bottom:3px"><span style="color:#52525b;width:20px;font-size:10px">${i+1}</span><span style="flex:1;font-size:11px">${n}</span><button onclick="rEmp(${i})" style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:16px">×</button></div>`);
    h+=`<button class="b" style="margin-top:8px;width:100%;border-style:dashed;border-color:#818cf8;color:#818cf8" onclick="sAdd()">+ Personel Ekle</button><div id="aa"></div>`;
    h+=`<button class="b" style="margin-top:16px;width:100%;border-color:#ef4444;color:#ef4444" onclick="if(confirm('Tüm veriler silinecek!')){localStorage.clear();location.reload()}">🗑 Sıfırla</button></div>`;
    app.insertAdjacentHTML('beforeend',h);
  }

  app.insertAdjacentHTML('beforeend','<div style="padding:8px 10px;border-top:1px solid #1e1f2e;color:#3f3f46;font-size:10px">💡 Güne tıkla → detay aç | Üst bardan toplu işlem | Mesai otomatik hesaplanır</div>');
}

function dayTot(el,data,d){let t=0;el.forEach((_,i)=>{const v=parseFloat(gc(data,i,d).m);if(!isNaN(v))t+=v});return t}
function empTot(el,data,i,days){let t=0;for(let d=1;d<=days;d++){const v=parseFloat(gc(data,i,d).m);if(!isNaN(v))t+=v}return t}
function eSt(data,i,days){const s={};for(let d=1;d<=days;d++){const c=gc(data,i,d);if(c.d)s[c.d]=(s[c.d]||0)+1}return s}
function bulkDay(d,cal,dur){const el_=emps(),data_=gd(yr,mo);el_.forEach((_,i)=>sc(yr,mo,data_,i,d,cal,dur,''));R()}
function rEmp(i){if(!confirm('Silmek istediğine emin misin?'))return;const e=emps();e.splice(i,1);ls('emps',e);R()}
function sAdd(){document.getElementById('aa').innerHTML='<div style="display:flex;gap:6px;margin-top:8px"><input id="nn" class="mi" style="flex:1;padding:6px 10px" placeholder="AD SOYAD" onkeydown="if(event.key===\'Enter\')dAdd()"><button onclick="dAdd()" class="b" style="background:#34d399;color:#0c0d14;border:none">Ekle</button></div>';document.getElementById('nn').focus()}
function dAdd(){const v=document.getElementById('nn').value.trim().toUpperCase();if(!v)return;const e=emps();e.push(v);ls('emps',e);R()}
function doExp(){const el_=emps(),data_=gd(yr,mo),days_=dim(yr,mo);let t="\uFEFF"+"ADI SOYADI\t";for(let d=1;d<=days_;d++)t+=d+' '+gn(yr,mo,d)+' Çalışma\tDurum\tMesai\tAçıklama\t';t+="TOPLAM\n";el_.forEach((n,i)=>{t+=n+'\t';for(let d=1;d<=days_;d++){const c=gc(data_,i,d);t+=(c.c||'')+'\t'+(c.d||'')+'\t'+c.m+'\t'+(c.a||'')+'\t'}t+=empTot(el_,data_,i,days_)+'\n'});const b=new Blob([t],{type:'text/tab-separated-values;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='PUANTAJ_'+AY[mo].toUpperCase()+'_'+yr+'.tsv';a.click()}

R();
</script>
</body>
</html>
