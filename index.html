<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BUZ 2 - Puantaj</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0c0d14;--bg2:#111219;--bg3:#16171f;--bg4:#1a1b2e;--bd:#1e1f2e;--bd2:#2a2b3d;--t:#d4d4d8;--t2:#a1a1aa;--t3:#71717a;--t4:#52525b;--p:#818cf8;--g:#34d399;--r:#ef4444;--y:#fbbf24;--o:#fb923c;--bl:#60a5fa;--pk:#f472b6}
body{font-family:'SF Mono','Menlo','Consolas',monospace;background:var(--bg);color:var(--t);font-size:12px;-webkit-tap-highlight-color:transparent}
.top{background:var(--bg2);border-bottom:1px solid var(--bd);padding:10px;position:sticky;top:0;z-index:100;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.top-l{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top-r{display:flex;gap:4px;flex-wrap:wrap}
.logo{font-weight:800;color:var(--p);font-size:14px;letter-spacing:1px}
select.s{background:var(--bg4);border:1px solid var(--bd2);border-radius:6px;color:var(--t);padding:4px 6px;font-size:12px;font-family:inherit}
.b{padding:5px 10px;border-radius:6px;border:1px solid var(--bd2);background:0;color:var(--t2);cursor:pointer;font-weight:600;font-size:11px;font-family:inherit;transition:.15s}
.b:hover{background:var(--bg4)}.b:active{transform:scale(.97)}
.b-p{border-color:var(--p);color:var(--p)}.b-g{border-color:var(--g);color:var(--g)}
.b-a{background:var(--p)!important;color:var(--bg)!important;border-color:var(--p)}
.dn{padding:6px 8px;background:#0f1019;border-bottom:1px solid var(--bd);display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.db{min-width:30px;height:30px;border-radius:4px;border:0;cursor:pointer;font-size:10px;font-weight:700;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:2px 3px;transition:.15s}
.db-n{background:var(--bg3);color:var(--t3)}.db-c{background:#1f1a0e;color:var(--y)}.db-p{background:#2d1215;color:#f87171}.db-a{background:var(--p)!important;color:var(--bg)!important}
.bk{padding:6px 10px;background:#13141f;border-bottom:1px solid var(--bd);display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tg{padding:3px 7px;border-radius:4px;border:1px solid;background:0;cursor:pointer;font-weight:600;font-size:10px;font-family:inherit}
.tg:active{transform:scale(.95)}
.tw{padding:4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
th{padding:6px 3px;text-align:center;font-size:10px;font-weight:700;color:var(--p);background:var(--bg2);border-bottom:2px solid var(--bd);position:sticky;top:0;z-index:15}
td{padding:3px 2px;text-align:center;font-size:11px;border-bottom:1px solid var(--bg2)}
.sn{position:sticky;left:0;z-index:10;font-weight:600;font-size:10px;text-align:left;padding:4px 6px;white-space:nowrap;border-right:2px solid var(--bd);max-width:120px;overflow:hidden;text-overflow:ellipsis}
.cl{cursor:pointer;min-width:36px;padding:2px 1px;transition:background .15s;-webkit-tap-highlight-color:transparent}
.cl:active{background:#1e1f35!important}
.ms{background:var(--bg3);border:1px solid var(--bd);border-radius:4px;color:var(--t);padding:3px;font-size:10px;font-family:inherit;outline:0;width:100%}
.mi{background:var(--bg3);border:1px solid var(--bd);border-radius:4px;color:var(--t);padding:3px 4px;font-size:10px;font-family:inherit;outline:0;width:100%}
.lg{padding:8px 10px;border-top:1px solid var(--bd);color:var(--t4);font-size:10px;display:flex;flex-wrap:wrap;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.err-box{background:#1f1015;border:1px solid #ef4444;border-radius:8px;padding:12px;margin:12px;color:#fca5a5;font-size:11px}
.err-box button{margin-top:8px}
@media(max-width:600px){
  .logo{font-size:12px}.top{padding:8px}.b{font-size:10px;padding:4px 8px}
  th{font-size:9px;padding:4px 2px}td{font-size:10px}.sn{font-size:9px;max-width:80px}
}
</style>
</head>
<body>

<div id="app"><div style="display:flex;justify-content:center;align-items:center;height:100vh;color:#818cf8;font-family:monospace">Yükleniyor...</div></div>

<script>
// ===== LOCAL STORAGE BACKEND =====
// No external database needed - everything saved in browser

function lsGet(key) { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) { return []; } }
function lsSet(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

// Init default employees
if (lsGet('pnt_emps').length === 0) {
  lsSet('pnt_emps', [
    "AYNUR SAVRAN","AY\u015eE EL\u0130K","EMİNE CAYMAZ","ESMA BÜBER",
    "FADİME ÇETİNKAYA","FADİME TURBAŞ","FATMA ATMACA","FATMA KORKMAZ",
    "FİLİZ ÇİFTÇİ","GÜLİZAR DENİZ","HANİFE KAYA","HÜLYA YILDIZ",
    "NAZMİYE URTAN","NEVİN İNAÇ","NURAY DOĞAN","SÜREYYA ŞAHİN",
    "ULVİYE EFE","YAŞAR ARABACI","HAZAL KANBER"
  ].map((name, i) => ({id: i+1, name, active: true})));
}

async function sGet(table, params) {
  if (table === 'employees') {
    return lsGet('pnt_emps').filter(e => e.active !== false).sort((a,b) => a.id - b.id);
  }
  if (table === 'puantaj') {
    const m = params.match(/year=eq\.(\d+).*month=eq\.(\d+)/);
    if (m) { const all = lsGet('pnt_data'); return all.filter(r => r.year==m[1] && r.month==m[2]); }
  }
  return [];
}
async function sUpsert(table, rows) {
  if (table === 'employees') {
    const data = lsGet('pnt_emps');
    rows.forEach(row => { const i = data.findIndex(e => e.id === row.id); if (i>=0) Object.assign(data[i],row); else data.push(row); });
    lsSet('pnt_emps', data);
  } else {
    const data = lsGet('pnt_data');
    rows.forEach(row => {
      const i = data.findIndex(e => e.year===row.year && e.month===row.month && e.emp_idx===row.emp_idx && e.day===row.day);
      if (i>=0) Object.assign(data[i], row); else data.push(row);
    });
    lsSet('pnt_data', data);
  }
  return rows;
}
async function sPost(table, rows) {
  if (table === 'employees') {
    const data = lsGet('pnt_emps');
    const maxId = data.reduce((m,e) => Math.max(m, e.id||0), 0);
    rows.forEach((row,i) => { row.id = maxId + i + 1; data.push(row); });
    lsSet('pnt_emps', data);
    return rows;
  }
  return rows;
}
async function sDelete() {}

const HEADERS = {}; const HEADERS_RET = {};

// ===== CONSTANTS =====
const CALISMA=["","08:00-16:00","08:00-18:00","08:00-20:00","16:00-24:00","24:00-08:00","20:00-08:00","Pazar Mesai-7,5","Pazar Mesai-11"];
const DURUMLAR=["","Off","DVS","Rapor","Ücretsiz İzin","Mazeret İzni","İstifa","Yıllık İzin","Cenazi İzni","Bayram İzni","Diğer"];
const MM={"08:00-16:00":0,"08:00-18:00":1.5,"08:00-20:00":3.5,"16:00-24:00":0,"24:00-08:00":0,"20:00-08:00":3.5,"Pazar Mesai-7,5":7.5,"Pazar Mesai-11":11};
const DC={"Off":"#71717a","DVS":"#ef4444","Rapor":"#fb923c","Ücretsiz İzin":"#a78bfa","Mazeret İzni":"#f472b6","İstifa":"#f59e0b","Yıllık İzin":"#60a5fa","Cenazi İzni":"#a78bfa","Bayram İzni":"#fbbf24","Diğer":"#a1a1aa"};
const DS={"Off":"OFF","DVS":"DVS","Rapor":"R","Ücretsiz İzin":"Üİ","Mazeret İzni":"Mİ","İstifa":"İST","Yıllık İzin":"Yİ","Cenazi İzni":"Cİ","Bayram İzni":"Bİ","Diğer":"D"};
const DB_={"Off":"#1a1215","DVS":"#1f1015","Bayram İzni":"#1f1a0e"};
const AYLAR=["","Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const GN=["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
function cM(c,d){if(!c || c===""){return d?"-":""}if(d&&d!=="")return "-";return MM[c]??""}
function dim(y,m){return new Date(y,m,0).getDate()}
function gn(y,m,d){return GN[new Date(y,m-1,d).getDay()]}

// ===== STATE =====
let S = {
  yr:2026, mo:5, emps:[], cells:{}, focus:null,
  view:"table", addMode:false, newName:"",
  sync:"ok", loaded:false, error:null
};

// ===== DATA LOADING =====
async function loadData() {
  S.loaded = false; S.error = null; render();
  try {
    const emps = await sGet('employees','select=id,name,active&active=eq.true&order=id');
    S.emps = emps;
    const rows = await sGet('puantaj',`select=emp_idx,day,calisma,durum,mesai,aciklama&year=eq.${S.yr}&month=eq.${S.mo}`);
    const cells = {};
    rows.forEach(r => { cells[`${r.emp_idx}-${r.day}`] = {c:r.calisma||"",d:r.durum||"",m:r.mesai||"",a:r.aciklama||""}; });
    S.cells = cells;
    S.loaded = true;
  } catch(e) {
    console.error(e);
    console.warn('Load error:',e);
    S.loaded = true;
  }
  render();
}

// ===== CELL OPERATIONS =====
let saveQueue = {};
let saveTimer = null;

function getCell(ei, day) {
  return S.cells[`${ei}-${day}`] || {c:"",d:"",m:"",a:""};
}

function setCell(ei, day, u) {
  const k = `${ei}-${day}`;
  const old = S.cells[k] || {c:"",d:"",m:"",a:""};
  const n = {...old,...u};
  if("c" in u || "d" in u) n.m = cM(n.c, n.d);
  S.cells[k] = n;
  // Queue save
  saveQueue[k] = {emp_idx:ei, day, year:S.yr, month:S.mo, calisma:n.c, durum:n.d, mesai:String(n.m), aciklama:n.a};
  scheduleSave();
  render();
}

function scheduleSave() {
  if(saveTimer) clearTimeout(saveTimer);
  S.sync = "saving";
  saveTimer = setTimeout(async()=>{
    const batch = Object.values(saveQueue);
    saveQueue = {};
    try {
      await sUpsert('puantaj', batch);
      S.sync = "ok";
    } catch(e) {
      console.error(e);
      S.sync = "error";
    }
    render();
  }, 600);
}

function bulkSet(day, u) {
  S.emps.forEach((emp, i) => {
    const k = `${i}-${day}`;
    const old = S.cells[k] || {c:"",d:"",m:"",a:""};
    const n = {...old,...u};
    if("c" in u || "d" in u) n.m = cM(n.c, n.d);
    S.cells[k] = n;
    saveQueue[k] = {emp_idx:i, day, year:S.yr, month:S.mo, calisma:n.c, durum:n.d, mesai:String(n.m), aciklama:n.a};
  });
  scheduleSave();
  render();
}

function dayTot(day) {
  let t=0;S.emps.forEach((_,i)=>{const c=getCell(i,day);if(c.m!==""&&c.m!=="-"&&!isNaN(c.m))t+=parseFloat(c.m)});return t;
}
function empTot(ei) {
  let t=0;for(let d=1;d<=dim(S.yr,S.mo);d++){const c=getCell(ei,d);if(c.m!==""&&c.m!=="-"&&!isNaN(c.m))t+=parseFloat(c.m)}return t;
}
function empStats(ei) {
  const s={};for(let d=1;d<=dim(S.yr,S.mo);d++){const c=getCell(ei,d);if(c.d)s[c.d]=(s[c.d]||0)+1}return s;
}

// ===== EXPORT =====
function doExport() {
  const days=dim(S.yr,S.mo);
  let t="\uFEFF"+"ADI SOYADI\t";
  for(let d=1;d<=days;d++)t+=`${d} ${gn(S.yr,S.mo,d)} Çalışma\tDurum\tMesai\tAçıklama\t`;
  t+="TOPLAM\n"+"Günlük Mesai\t";
  for(let d=1;d<=days;d++)t+=`\t\t${dayTot(d)}\t\t`;
  t+="\n";
  S.emps.forEach((emp,i)=>{
    t+=`${emp.name}\t`;
    for(let d=1;d<=days;d++){const c=getCell(i,d);t+=`${c.c||""}\t${c.d||""}\t${c.m}\t${c.a||""}\t`}
    t+=`${empTot(i)}\n`;
  });
  const b=new Blob([t],{type:"text/tab-separated-values;charset=utf-8;"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);
  a.download=`BUZ_2_PUANTAJ_${AYLAR[S.mo].toUpperCase()}_${S.yr}.tsv`;a.click();
}

// ===== ADD/REMOVE EMPLOYEE =====
async function addEmp() {
  if(!S.newName.trim())return;
  try {
    const res = await sPost('employees',[{name:S.newName.trim().toUpperCase(),active:true}]);
    S.newName="";S.addMode=false;
    await loadData();
  }catch(e){alert("Hata: "+e.message)}
}
async function removeEmp(id) {
  if(!confirm("Bu personeli silmek istediğine emin misin?"))return;
  try{
    await sUpsert('employees',[{id,active:false}]);
    await loadData();
  }catch(e){alert("Hata: "+e.message)}
}

// ===== RENDER =====
function h(tag,a,...ch){
  const el=document.createElement(tag);
  if(a)for(const[k,v]of Object.entries(a)){
    if(k==='style'&&typeof v==='object')Object.assign(el.style,v);
    else if(k.startsWith('on'))el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='className')el.className=v;
    else if(k==='innerHTML')el.innerHTML=v;
    else el.setAttribute(k,v);
  }
  for(const c of ch){if(c==null)continue;if(typeof c==='string'||typeof c==='number')el.appendChild(document.createTextNode(c));else if(Array.isArray(c))c.forEach(x=>x&&el.appendChild(x));else el.appendChild(c)}
  return el;
}

function render(){
  const app=document.getElementById('app');
  const sl=app.querySelector('.tw')?.scrollLeft||0;
  app.innerHTML='';

  const days=dim(S.yr,S.mo);

  // TOPBAR
  const mSel=h('select',{className:'s',onChange:e=>{S.mo=+e.target.value;S.focus=null;loadData()}});
  AYLAR.slice(1).forEach((a,i)=>{const o=h('option',{value:i+1},a);if(i+1===S.mo)o.selected=true;mSel.appendChild(o)});
  const ySel=h('select',{className:'s',onChange:e=>{S.yr=+e.target.value;S.focus=null;loadData()}});
  [2024,2025,2026,2027].forEach(y=>{const o=h('option',{value:y},String(y));if(y===S.yr)o.selected=true;ySel.appendChild(o)});

  const syncCol=S.sync==='ok'?'var(--g)':S.sync==='saving'?'var(--y)':'var(--r)';
  app.appendChild(h('div',{className:'top'},
    h('div',{className:'top-l'},
      h('span',{style:{fontSize:'16px'}},'📋'),
      h('span',{className:'logo'},'PUANTAJ'),
      mSel,ySel,
      h('span',{className:'dot',style:{background:syncCol}}),
      S.sync!=='ok'?h('span',{style:{fontSize:'9px',color:syncCol}},S.sync==='saving'?'kaydediyor...':'hata!'):null
    ),
    h('div',{className:'top-r'},
      ...["table","ozet","ayar"].map(v=>h('button',{className:`b b-p ${S.view===v?'b-a':''}`,onClick:()=>{S.view=v;render()}},
        v==="table"?"📅 Puantaj":v==="ozet"?"📊 Özet":"⚙️ Personel")),
      h('button',{className:'b b-g',onClick:doExport},'📥 Export')
    )
  ));

  // ADD EMPLOYEE
  if(S.addMode){
    const inp=h('input',{className:'mi',style:{flex:'1',fontSize:'12px',padding:'6px 10px'},placeholder:'AD SOYAD',value:S.newName,
      onInput:e=>{S.newName=e.target.value},onKeydown:e=>{if(e.key==='Enter')addEmp()}});
    app.appendChild(h('div',{style:{padding:'8px 10px',background:'var(--bg4)',display:'flex',gap:'6px',alignItems:'center'}},
      inp,
      h('button',{className:'b',style:{background:'var(--g)',color:'var(--bg)',border:'none'},onClick:addEmp},'Ekle'),
      h('button',{className:'b',onClick:()=>{S.addMode=false;render()}},'İptal')
    ));
  }

  // ERROR
  if(S.error){
    app.appendChild(h('div',{className:'err-box'},
      h('div',null,'⚠️ Bağlantı hatası: '+S.error),
      h('div',{style:{marginTop:'6px',fontSize:'10px',color:'#a1a1aa'}},'SQL Editor\'da tabloları oluşturdun mu? Sayfayı yenile veya:'),
      h('button',{className:'b',style:{marginTop:'8px',borderColor:'var(--y)',color:'var(--y)'},onClick:loadData},'🔄 Tekrar Dene')
    ));
  }

  if(!S.loaded){app.appendChild(h('div',{style:{padding:'40px',textAlign:'center',color:'var(--p)'}},'Yükleniyor...'));return}

  // DAY NAV
  if(S.view==="table"){
    const nav=h('div',{className:'dn'});
    for(let d=1;d<=days;d++){
      const g=gn(S.yr,S.mo,d);const isPaz=g==='Paz';const isCmt=g==='Cmt';
      nav.appendChild(h('button',{className:`db ${S.focus===d?'db-a':isPaz?'db-p':isCmt?'db-c':'db-n'}`,
        onClick:()=>{S.focus=S.focus===d?null:d;render()}},
        h('span',null,String(d)),h('span',{style:{fontSize:'7px',opacity:'.7'}},g)));
    }
    app.appendChild(nav);
  }

  // BULK
  if(S.view==="table"&&S.focus){
    const fd=S.focus;
    const bar=h('div',{className:'bk'},
      h('span',{style:{color:'var(--p)',fontWeight:'700',fontSize:'11px'}},`${fd} ${AYLAR[S.mo]} →`));
    [["OFF","var(--r)",{c:"",d:"Off"}],["Bayram","var(--y)",{c:"",d:"Bayram İzni"}],
     ["08-16","var(--bl)",{c:"08:00-16:00",d:""}],["08-18","var(--bl)",{c:"08:00-18:00",d:""}],
     ["08-20","var(--bl)",{c:"08:00-20:00",d:""}],["16-24","var(--p)",{c:"16:00-24:00",d:""}],
     ["20-08","var(--p)",{c:"20:00-08:00",d:""}],["24-08","var(--p)",{c:"24:00-08:00",d:""}]
    ].forEach(([l,co,u])=>bar.appendChild(h('button',{className:'tg',style:{borderColor:co,color:co},onClick:()=>bulkSet(fd,u)},l)));
    bar.appendChild(h('span',{style:{color:'var(--t4)',fontSize:'10px',marginLeft:'6px'},innerHTML:`Mesai: <b style="color:var(--g)">${dayTot(fd)}</b>`}));
    app.appendChild(bar);
  }

  // TABLE VIEW
  if(S.view==="table"&&!S.error){
    const wrap=h('div',{className:'tw'});
    const tbl=h('table');const thead=h('thead');const hr=h('tr');
    hr.appendChild(h('th',{style:{position:'sticky',left:'0',zIndex:'20',background:'var(--bg2)',minWidth:'100px',textAlign:'left',paddingLeft:'6px'}},'ADI SOYADI'));
    const sd=S.focus?[S.focus]:Array.from({length:days},(_,i)=>i+1);
    sd.forEach(d=>{
      const g=gn(S.yr,S.mo,d);const col=S.focus?'4':'1';
      const t=h('th',{colSpan:col,style:{background:g==='Paz'?'#1f1015':'var(--bg2)',color:g==='Paz'?'#f87171':'var(--p)',borderLeft:'1px solid var(--bd2)',minWidth:S.focus?'340px':'36px',fontSize:'10px'}},
        h('div',null,`${d} ${g}`));
      if(S.focus)t.appendChild(h('div',{style:{fontSize:'8px',display:'flex',gap:'16px',justifyContent:'center',marginTop:'2px',color:'var(--t4)'}},
        h('span',null,'Çalışma'),h('span',null,'Durum'),h('span',null,'Mesai'),h('span',null,'Açıklama')));
      hr.appendChild(t);
    });
    hr.appendChild(h('th',{style:{color:'var(--g)',background:'var(--bg2)'}},'∑'));
    thead.appendChild(hr);tbl.appendChild(thead);

    const tbody=h('tbody');
    // Day totals
    const tr0=h('tr',{style:{background:'#0f1019'}});
    tr0.appendChild(h('td',{className:'sn',style:{background:'#0f1019',fontWeight:'700',color:'var(--p)',fontSize:'9px'}},'Günlük Mesai'));
    sd.forEach(d=>tr0.appendChild(h('td',{colSpan:S.focus?'4':'1',style:{fontWeight:'700',color:dayTot(d)>0?'var(--g)':'#3f3f46',borderLeft:'1px solid var(--bd)',fontSize:'11px'}},String(dayTot(d)||'-'))));
    tr0.appendChild(h('td'));tbody.appendChild(tr0);

    S.emps.forEach((emp,ei)=>{
      const tot=empTot(ei);const bg=ei%2===0?'var(--bg)':'var(--bg2)';
      const tr=h('tr',{style:{background:bg}});
      tr.appendChild(h('td',{className:'sn',style:{background:bg}},emp.name));

      sd.forEach(d=>{
        const cell=getCell(ei,d);
        if(S.focus){
          const td=h('td',{style:{borderLeft:'1px solid var(--bd)',padding:'2px'}});
          const row=h('div',{style:{display:'flex',gap:'2px',alignItems:'center'}});

          const s1=h('select',{className:'ms',style:{flex:'2',color:cell.c?'var(--t)':'#3f3f46'},onChange:e=>setCell(ei,d,{c:e.target.value})});
          CALISMA.forEach(o=>{const op=h('option',{value:o},o||'—');if(o===cell.c)op.selected=true;s1.appendChild(op)});

          const s2=h('select',{className:'ms',style:{flex:'2',color:DC[cell.d]||(cell.d?'var(--o)':'#3f3f46')},onChange:e=>setCell(ei,d,{d:e.target.value})});
          DURUMLAR.forEach(o=>{const op=h('option',{value:o},o||'—');if(o===cell.d)op.selected=true;s2.appendChild(op)});

          const sp=h('span',{style:{minWidth:'28px',textAlign:'center',fontSize:'11px',fontWeight:'700',color:cell.m>0?'var(--g)':'#3f3f46'}},String(cell.m??''));
          const inp=h('input',{className:'mi',placeholder:'...',value:cell.a||'',onInput:e=>setCell(ei,d,{a:e.target.value})});

          row.appendChild(s1);row.appendChild(s2);row.appendChild(sp);row.appendChild(inp);
          td.appendChild(row);tr.appendChild(td);
        } else {
          let disp='',tc='#3f3f46',bgc='transparent';
          if(cell.d){disp=DS[cell.d]||cell.d;tc=DC[cell.d]||'var(--t2)';bgc=DB_[cell.d]||'transparent'}
          else if(cell.c){if(cell.m>0){disp=cell.m;tc='var(--g)';bgc='#0f1a15'}else{disp=cell.c.replace(/:00/g,'').replace('-','\n');tc='var(--t4)'}}
          tr.appendChild(h('td',{className:'cl',style:{borderLeft:gn(S.yr,S.mo,d)==='Paz'?'2px solid #2d1215':'1px solid var(--bd)',background:bgc},onClick:()=>{S.focus=d;render()}},
            h('div',{style:{fontSize:'9px',fontWeight:'700',color:tc,lineHeight:'1.2',whiteSpace:'pre-line',textAlign:'center'}},disp||'·')));
        }
      });
      tr.appendChild(h('td',{style:{fontWeight:'700',color:tot>0?'var(--g)':'#3f3f46',fontSize:'11px'}},String(tot||'-')));
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);wrap.appendChild(tbl);app.appendChild(wrap);
    requestAnimationFrame(()=>{const w=app.querySelector('.tw');if(w)w.scrollLeft=sl});
  }

  // ÖZET
  if(S.view==="ozet"&&!S.error){
    const tbl=h('table',{style:{width:'100%',borderCollapse:'collapse'}});
    const thead=h('thead');const tr=h('tr');
    ['Personel','Mesai','Off','DVS','R','Üİ','Mİ','Yİ','Bİ','İST','Gün'].forEach(t=>
      tr.appendChild(h('th',{style:{padding:'8px 4px',background:'var(--bg2)',color:'var(--p)',borderBottom:'2px solid var(--bd)',fontSize:'10px'}},t)));
    thead.appendChild(tr);tbl.appendChild(thead);
    const tbody=h('tbody');
    S.emps.forEach((emp,i)=>{
      const s=empStats(i);const t=empTot(i);
      let wd=0;for(let d=1;d<=days;d++){const c=getCell(i,d);if(c.c&&!c.d)wd++}
      const row=h('tr',{style:{background:i%2===0?'var(--bg2)':'#14151f'}},
        h('td',{style:{padding:'6px',textAlign:'left',fontWeight:'700',fontSize:'11px',borderBottom:'1px solid var(--bd)'}},emp.name),
        h('td',{style:{padding:'6px',textAlign:'center',color:t>0?'var(--g)':'var(--t4)',fontWeight:'700',borderBottom:'1px solid var(--bd)'}},String(t)),
        ...[['Off'],['DVS'],['Rapor'],['Ücretsiz İzin'],['Mazeret İzni'],['Yıllık İzin'],['Bayram İzni'],['İstifa']].map(([k])=>
          h('td',{style:{padding:'6px',textAlign:'center',color:s[k]?DC[k]||'var(--t2)':'var(--t4)',borderBottom:'1px solid var(--bd)',fontSize:'11px'}},s[k]?String(s[k]):'-')),
        h('td',{style:{padding:'6px',textAlign:'center',borderBottom:'1px solid var(--bd)',fontSize:'11px'}},String(wd))
      );
      tbody.appendChild(row);
    });
    tbl.appendChild(tbody);app.appendChild(h('div',{style:{padding:'12px',overflowX:'auto'}},tbl));
  }

  // PERSONEL
  if(S.view==="ayar"){
    const div=h('div',{style:{padding:'12px',maxWidth:'500px'}});
    div.appendChild(h('p',{style:{color:'var(--p)',fontWeight:'700',marginBottom:'12px'}},`👥 Personel (${S.emps.length})`));
    S.emps.forEach((emp,i)=>{
      div.appendChild(h('div',{style:{display:'flex',alignItems:'center',gap:'8px',padding:'6px 8px',background:i%2===0?'var(--bg2)':'#14151f',borderRadius:'6px',marginBottom:'3px'}},
        h('span',{style:{color:'var(--t4)',width:'20px',fontSize:'10px'}},String(i+1)),
        h('span',{style:{flex:'1',fontSize:'11px'}},emp.name),
        h('button',{style:{background:'none',border:'none',color:'var(--r)',cursor:'pointer',fontSize:'16px'},onClick:()=>removeEmp(emp.id)},'×')
      ));
    });
    if(!S.addMode){
      div.appendChild(h('button',{className:'b b-p',style:{marginTop:'8px',width:'100%',borderStyle:'dashed'},onClick:()=>{S.addMode=true;render()}},'+ Personel Ekle'));
    }
    div.appendChild(h('button',{className:'b',style:{marginTop:'16px',width:'100%',borderColor:'var(--r)',color:'var(--r)'},onClick:()=>{if(confirm('Tüm veriler silinecek, emin misin?')){localStorage.clear();location.reload()}}},'🗑 Tüm Verileri Sıfırla'));
    app.appendChild(div);
  }

  // LEGEND
  const lg=h('div',{className:'lg'});
  Object.entries(DS).forEach(([k,v])=>lg.appendChild(h('span',{style:{color:DC[k]},innerHTML:`<b>${v}</b>`})));
  lg.appendChild(h('span',{style:{marginLeft:'auto'}},'💡 Güne tıkla → detay | Toplu işlem üstte | Mesai otomatik'));
  app.appendChild(lg);
}

// START
loadData();
</script>
</body>
</html>
